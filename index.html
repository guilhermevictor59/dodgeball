<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>DodgeBall League · Pyro contra Pyro</title>
<meta name="description" content="Jogo grátis no navegador: rebata o foguete teleguiado com a rajada de ar e mande ele de volta. Jogue contra o bot ou online 1x1.">
<meta name="theme-color" content="#1c130d">
<meta property="og:title" content="DodgeBall League">
<meta property="og:description" content="Pyro contra Pyro no navegador. Rebata o foguete, ele fica mais rápido a cada rebatida. Grátis, sem instalar.">
<meta property="og:image" content="https://guilhermevictor59.github.io/dodgeball/capa.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="icone.svg">
<link rel="preload" href="fontes/Anton-Regular.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face { font-family: "Anton"; src: url("fontes/Anton-Regular.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Barlow"; src: url("fontes/BarlowCondensed-Bold.ttf") format("truetype"); font-display: swap; }
:root {
	--fundo: #1c130d;
	--fundo2: #2e1d12;
	--laranja: #f0892a;
	--creme: #efe3cc;
	--apagado: #a8927a;
}
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--fundo); color: var(--creme); overflow: hidden; touch-action: none; font-family: "Barlow", "Arial Narrow", sans-serif; }
#canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; }
#canvas:focus { outline: none; }

#tela {
	position: fixed; inset: 0; z-index: 2;
	display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
	padding: 24px 16px; box-sizing: border-box; text-align: center;
	background:
		radial-gradient(ellipse at 50% 120%, rgba(240,137,42,.28), transparent 60%),
		linear-gradient(180deg, var(--fundo2), var(--fundo));
	transition: opacity .5s;
}
#tela.sumindo { opacity: 0; pointer-events: none; }
.foguete { width: 76px; height: 76px; animation: voa 1.6s ease-in-out infinite; }
@keyframes voa { 0%,100% { transform: translateY(0) rotate(-35deg); } 50% { transform: translateY(-10px) rotate(-35deg); } }
h1 { font-family: "Anton", Impact, sans-serif; font-weight: 400; font-size: clamp(44px, 9vw, 104px); line-height: .95; letter-spacing: 1px; margin: 0; color: var(--laranja); text-transform: uppercase; text-shadow: 0 4px 0 #7a3d10; }
.sub { font-size: clamp(18px, 2.6vw, 26px); letter-spacing: 3px; text-transform: uppercase; margin: 0; }
.barra { width: min(420px, 82vw); height: 14px; background: #120c08; border: 2px solid #4a3020; border-radius: 3px; overflow: hidden; margin-top: 10px; }
.barra > div { height: 100%; width: 0; background: repeating-linear-gradient(-45deg, var(--laranja) 0 12px, #d0711c 12px 24px); transition: width .2s; }
#estado { font-size: 18px; color: var(--apagado); letter-spacing: 1px; text-transform: uppercase; min-height: 22px; }
#aviso { display: none; max-width: 520px; background: #3a1d1d; border: 1px solid #8a3a2a; border-radius: 6px; padding: 14px 18px; font-size: 17px; line-height: 1.35; }
.rodape { position: absolute; bottom: 14px; left: 0; right: 0; font-size: 14px; color: #6e5a47; letter-spacing: 1px; }
</style>
</head>
<body>
<canvas id="canvas">Seu navegador não suporta canvas.</canvas>
<noscript>Ative o JavaScript para jogar.</noscript>

<div id="tela">
	<svg class="foguete" viewBox="0 0 64 64" aria-hidden="true">
		<path d="M32 4c9 8 12 20 10 34H22C20 24 23 12 32 4z" fill="#efe3cc"/>
		<path d="M32 4c4 4 7 9 8.5 15h-17C25 13 28 8 32 4z" fill="#f0892a"/>
		<circle cx="32" cy="26" r="4.5" fill="#1c130d"/>
		<path d="M22 30l-9 12 9-2zM42 30l9 12-9-2z" fill="#f0892a"/>
		<path d="M25 40h14l-3 6h-8z" fill="#7a3d10"/>
		<path d="M27 47c1 6 3 10 5 13 2-3 4-7 5-13z" fill="#f0892a" opacity=".85"/>
	</svg>
	<h1>DodgeBall League</h1>
	<p class="sub">· Pyro contra Pyro ·</p>
	<div class="barra"><div id="progresso"></div></div>
	<div id="estado">Carregando…</div>
	<div id="aviso"></div>
	<div class="rodape">Grátis no navegador · F11 deixa em tela cheia</div>
</div>

<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":3900344,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
// baixa sempre a versão nova do jogo (sem isso o navegador pode ficar com a antiga e não achar a sala dos outros)
const VERSAO_PCK = "6259002d75";
const _fetch = window.fetch.bind(window);
window.fetch = (u, o) => _fetch(u === 'index.pck' ? 'index.pck?v=' + VERSAO_PCK : u, o);
const engine = new Engine(GODOT_CONFIG);

(function () {
	const tela = document.getElementById('tela');
	const progresso = document.getElementById('progresso');
	const estado = document.getElementById('estado');
	const aviso = document.getElementById('aviso');
	function falhou(msg) {
		estado.textContent = 'Não deu para abrir o jogo';
		aviso.textContent = msg;
		aviso.style.display = 'block';
	}

	const faltando = Engine.getMissingFeatures({ threads: false });
	if (faltando.length) {
		falhou('Seu navegador não tem o que o jogo precisa (' + faltando.join(', ') + '). Tente o Chrome, Edge ou Firefox atualizados.');
		return;
	}
	const mb = (n) => (n / 1048576).toFixed(0);
	engine.startGame({
		onProgress: function (atual, total) {
			if (atual > 0 && total > 0) {
				progresso.style.width = (100 * atual / total).toFixed(1) + '%';
				estado.textContent = atual >= total ? 'Preparando a arena…' : 'Carregando ' + mb(atual) + ' de ' + mb(total) + ' MB';
			}
		},
	}).then(() => {
		tela.classList.add('sumindo');
		setTimeout(() => tela.remove(), 600);
	}, (err) => {
		console.error(err);
		falhou(err && err.message ? err.message : String(err));
	});
}());
</script>
</body>
</html>
